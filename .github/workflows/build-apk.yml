name: Build Medical Clinic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Keystore and Google Services
        run: |
          # ساخت فایل کلید debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true

          # ساخت google-services.json با پکیج نیم دقیق پروژه
          MOCK_SERVICES='{
            "project_info": {
              "project_number": "123456789012",
              "project_id": "medical-clinic-app",
              "storage_bucket": "medical-clinic-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "com.aistudio.medicalclinic.clnxapp"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildPass12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }'
          echo "$MOCK_SERVICES" > app/google-services.json
          echo "$MOCK_SERVICES" > google-services.json

      - name: Generate Wrapper and Build Debug APK
        run: |
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medical-clinic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
