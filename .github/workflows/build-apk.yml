name: Build Medical Clinic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate and Prepare Project
        id: prep
        run: |
          # پیدا کردن محل قرارگیری پروژه
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$PKG_PATH" ]; then
            PROJ_DIR=$(dirname "$PKG_PATH")
            echo "Web project found at: $PROJ_DIR"
            cd "$PROJ_DIR"
            npm install
            npm run build || true

            OUTPUT_DIR="dist"
            if [ -d "build" ]; then
              OUTPUT_DIR="build"
            elif [ -d "out" ]; then
              OUTPUT_DIR="out"
            fi

            # ساخت پوشه خروجی در صورت عدم وجود
            mkdir -p "$OUTPUT_DIR"

            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "Medical Clinic" "com.medicalclinic.app" --web-dir "$OUTPUT_DIR"
            npx cap add android
            npx cap sync android
          elif [ -n "$GRADLEW_PATH" ]; then
            echo "Android native project found at: $(dirname "$GRADLEW_PATH")"
          else
            echo "Listing all files in repository for debug:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            TARGET_DIR=$(dirname "$GRADLEW_PATH")
            echo "Building APK in directory: $TARGET_DIR"
            cd "$TARGET_DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Error: No gradlew found anywhere!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medical-clinic-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
